<script>
const VIDEO_DURATION = 180;
const YOUTUBE_ID = '9uPybhkqYw4';
const ROOT_REF = 'okoningana';
let currentLang = 'fr';

const supabase = window.supabase.createClient(
  "https://YOUR-PROJECT.supabase.co",
  "YOUR-ANON-KEY"
);

function selectLang(lang) {
  currentLang = lang;

  document.getElementById("overlay").style.display = "none";
  document.getElementById("app").style.display = "block";
}

async function handleAuth() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  if (!email || !password) {
    alert("Veuillez remplir email et mot de passe");
    return;
  }

  try {
    let { error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      const { error: signupError } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: {
            language: currentLang,
            sponsor_id: ROOT_REF
          }
        }
      });

      if (signupError) {
        alert("Erreur : " + signupError.message);
        return;
      }
    }

    goToVideo();

  } catch (err) {
    alert("Erreur système : " + err.message);
  }
}

function goToVideo() {
  document.getElementById("auth-section").style.display = "none";
  document.getElementById("video-section").style.display = "block";

  document.getElementById("circle1").classList.remove("active");
  document.getElementById("circle1").classList.add("done");
  document.getElementById("circle2").classList.add("active");

  showPopup();
}

function showPopup() {
  const popup = document.getElementById("popup");
  popup.style.display = "block";

  setTimeout(() => {
    document.getElementById("watchBtn").disabled = false;
  }, 10000);
}

document.getElementById("watchBtn").addEventListener("click", async () => {

  window.open(
    "https://www.youtube.com/watch?v=" + YOUTUBE_ID,
    "_blank"
  );

  let remaining = VIDEO_DURATION;

  const timer = setInterval(async () => {

    remaining--;

    if (remaining <= 0) {

      clearInterval(timer);

      document.getElementById("getLinkBtn").disabled = false;

      try {
        const {
          data: { user }
        } = await supabase.auth.getUser();

        if (user) {
          const { error } = await supabase.rpc(
            "mark_video_completed",
            {
              user_id: user.id
            }
          );

          if (error) {
            alert("Erreur vidéo : " + error.message);
          }
        }

      } catch (err) {
        console.error(err);
      }
    }

  }, 1000);
});

document.getElementById("getLinkBtn").addEventListener("click", () => {

  document.getElementById("video-section").style.display = "none";
  document.getElementById("link-section").style.display = "block";

  document.getElementById("circle2").classList.remove("active");
  document.getElementById("circle2").classList.add("done");
  document.getElementById("circle3").classList.add("active");

  document.getElementById("sponsorInfo").innerText =
    "Votre sponsor racine : " + ROOT_REF;
});

function openVictory() {
  window.open("https://victory.com", "_blank");

  document.getElementById("link-section").style.display = "none";
  document.getElementById("val-section").style.display = "block";

  document.getElementById("circle3").classList.remove("active");
  document.getElementById("circle3").classList.add("done");
  document.getElementById("circle4").classList.add("active");
}

function finalValidation() {

  const victoryLink = document.getElementById("victoryLink").value;

  if (!victoryLink) {
    alert("Veuillez coller votre lien Victory");
    return;
  }

  alert("Compte validé avec succès");
}
</script>
