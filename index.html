<script>
// --- CONFIGURATION ---
const VIDEO_ID = '9uPybhkqYw4';
const REQUIRED_TIME = 180;
const ROOT_SPONSOR = 'okoningana';
const supabase = window.supabase.createClient("VOTRE_URL", "VOTRE_ANON_KEY");

let currentUser = null;
let timerInterval;

// --- 1. GESTION DE LA LANGUE & INITIALISATION ---
async function selectLang(lang) {
    document.getElementById("overlay").style.display = "none";
    document.getElementById("app").style.display = "block";
    
    // Vérifier si l'utilisateur est déjà connecté
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
        currentUser = session.user;
        checkProgress();
    }
}

// --- 2. AUTHENTIFICATION AVEC CRÉATION DE PROFIL ---
async function handleAuth() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    // Tentative de connexion
    let { data, error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
        // Tentative d'inscription si le compte n'existe pas
        const { data: upData, error: upError } = await supabase.auth.signUp({
            email, password,
            options: { data: { sponsor: ROOT_SPONSOR } }
        });

        if (upError) return alert("Erreur: " + upError.message);
        
        // Création du profil initial dans la table 'profiles'
        await supabase.from('profiles').insert([
            { id: upData.user.id, email: email, sponsor_id: ROOT_SPONSOR, current_step: 2 }
        ]);
        currentUser = upData.user;
    } else {
        currentUser = data.user;
    }
    checkProgress();
}

// --- 3. LOGIQUE MÉTIER : VÉRIFICATION DE LA PROGRESSION ---
async function checkProgress() {
    const { data: profile } = await supabase
        .from('profiles')
        .select('*')
        .eq('id', currentUser.id)
        .single();

    if (!profile) return;

    // Redirection automatique selon l'étape enregistrée en BDD
    if (profile.current_step === 4) {
        showSection("val-section", 4);
    } else if (profile.video_completed || profile.current_step === 3) {
        loadSponsorStep(profile.sponsor_id);
    } else if (profile.current_step === 2) {
        showSection("video-section", 2);
        initYouTubePlayer();
    }
}

// --- 4. LOGIQUE VIDÉO (BLOCAGE TEMPOREL) ---
function initYouTubePlayer() {
    // Charge l'API YouTube seulement si nécessaire
    if (window.YT) { onYouTubeIframeAPIReady(); return; }
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.append(tag);
}

function onYouTubeIframeAPIReady() {
    new YT.Player('player', {
        height: '315', width: '100%', videoId: VIDEO_ID,
        events: { 'onStateChange': (e) => {
            if (e.data == YT.PlayerState.PLAYING) {
                timerInterval = setInterval(updateVideoTimer, 1000);
            } else {
                clearInterval(timerInterval);
            }
        }}
    });
}

async function updateVideoTimer() {
    // Logique métier : On peut vérifier le temps réel du player ici
    // Une fois terminé :
    const { error } = await supabase.rpc('mark_video_completed', { user_id: currentUser.id });
    if (!error) {
        document.getElementById('getLinkBtn').disabled = false;
        clearInterval(timerInterval);
    }
}

// --- 5. LOGIQUE DE PARRAINAGE ---
function loadSponsorStep(sponsorId) {
    showSection("link-section", 3);
    document.getElementById('sponsorInfo').innerHTML = `Votre parrain : <strong>${sponsorId}</strong>`;
    
    // On génère le lien Victory avec l'ID du parrain stocké
    window.currentSponsorLink = `https://victory-investment.com/register?ref=${sponsorId}`;
}

function openVictory() {
    window.open(window.currentSponsorLink, "_blank");
}

// --- 6. VALIDATION FINALE ET FERMETURE DE LA BOUCLE ---
async function finalValidation() {
    const vLink = document.getElementById("victoryLink").value;
    
    // Regex simple pour forcer un lien Victory
    if (!vLink.includes("victory-investment.com")) {
        return alert("Veuillez coller votre véritable lien Victory !");
    }

    const { error } = await supabase
        .from('profiles')
        .update({ victory_link: vLink, current_step: 4 })
        .eq('id', currentUser.id);

    if (!error) {
        alert("Succès ! Votre compte LINK FLOW est activé.");
        location.reload(); 
    }
}

// Utilitaire d'affichage
function showSection(id, step) {
    document.querySelectorAll('section').forEach(s => s.style.display = 'none');
    document.getElementById(id).style.display = 'block';
    // Mise à jour visuelle des cercles...
}
</script>
