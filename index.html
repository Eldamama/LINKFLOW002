<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINK FLOW</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; text-align: center; }
    #language-screen { padding: 20px; }
    .lang-container { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 10px; 
      max-width: 400px; 
      margin: 20px auto; 
    }
    .lang-btn { padding: 10px; cursor: pointer; border: 1px solid #ccc; border-radius: 5px; }
    .hidden { display: none !important; }
    input { display: block; margin: 10px auto; padding: 8px; width: 80%; max-width: 300px; }
    button { margin: 10px; padding: 10px 20px; cursor: pointer; }
    .confirmation { color: green; font-weight: bold; margin: 10px; }
  </style>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "TON_SUPABASE_URL";
    const supabaseKey = "TON_SUPABASE_ANON_KEY";
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
  </script>
</head>
<body>

<!-- Écran de sélection de langue -->
<div id="language-screen">
  <h1>🌐 Choisissez votre langue</h1>
  <div class="lang-container">
    <button class="lang-btn" onclick="selectLanguage('fr')">🇫🇷 Français</button>
    <button class="lang-btn" onclick="selectLanguage('en')">🇬🇧 English</button>
    <button class="lang-btn" onclick="selectLanguage('hi')">🇮🇳 हिन्दी</button>
    <button class="lang-btn" onclick="selectLanguage('pt')">🇵🇹 Português</button>
    <button class="lang-btn" onclick="selectLanguage('es')">🇪🇸 Español</button>
    <button class="lang-btn" onclick="selectLanguage('ar')">🇸🇦 العربية</button>
  </div>
</div>

<!-- Formulaire d'inscription -->
<div id="register-form" class="hidden">
  <h2>Étape 1 — Authentification</h2>
  <p id="confirmation" class="confirmation"></p>
  <label for="email">Email</label>
  <input type="email" id="email" placeholder="Email">
  <label for="password">Mot de passe</label>
  <input type="password" id="password" placeholder="Mot de passe">
  <button id="register-btn" onclick="handleRegister()">Connexion / Inscription</button>
</div>

<script>
let selectedLanguage = null;

function selectLanguage(lang) {
  selectedLanguage = lang;
  document.getElementById("language-screen").classList.add("hidden");
  document.getElementById("register-form").classList.remove("hidden");
  document.getElementById("confirmation").textContent = 
    "✅ Formulaire ouvert en " + getLanguageName(lang);
}

function getLanguageName(code) {
  switch(code) {
    case 'fr': return "Français";
    case 'en': return "English";
    case 'hi': return "Hindi";
    case 'pt': return "Português";
    case 'es': return "Español";
    case 'ar': return "Arabe";
    default: return code;
  }
}

async function handleRegister() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const btn = document.getElementById("register-btn");

  if (!email || !password) {
    alert("Veuillez remplir tous les champs");
    return;
  }

  // État "loading"
  btn.disabled = true;
  btn.textContent = "Chargement...";

  // Auth Supabase (sign up)
  const { data, error } = await supabase.auth.signUp({ email, password });

  if (error) {
    alert("Erreur auth: " + error.message);
    btn.disabled = false;
    btn.textContent = "Connexion / Inscription";
    return;
  }

  const user = data?.user;
  if (!user) {
    alert("Compte créé mais utilisateur non disponible (confirmation email peut être activée).");
    btn.disabled = false;
    btn.textContent = "Connexion / Inscription";
    return;
  }

  // Sauvegarde langue dans profils
  const { error: profileError } = await supabase
    .from("profiles")
    .upsert({
      id: user.id,
      email,
      language: selectedLanguage
    }, { onConflict: 'id' });

  if (profileError) {
    alert("Erreur profil: " + profileError.message);
    btn.disabled = false;
    btn.textContent = "Connexion / Inscription";
    return;
  }

  alert("Compte créé avec succès en " + getLanguageName(selectedLanguage));

  // Réinitialiser bouton
  btn.disabled = false;
  btn.textContent = "Connexion / Inscription";
}
</script>

</body>
</html>
