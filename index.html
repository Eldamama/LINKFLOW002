<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINK FLOW</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; }
    .lang-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 400px; margin: 20px auto; }
    .lang-btn { padding: 10px; cursor: pointer; border: 1px solid #ccc; border-radius: 5px; }
    .hidden { display: none !important; }
    input { display: block; margin: 10px auto; padding: 8px; width: 80%; max-width: 300px; }
    button { margin: 10px; padding: 10px 20px; cursor: pointer; }
    .confirmation { color: green; font-weight: bold; margin: 10px; }
    #loader { display: none; margin: 15px; font-weight: bold; color: #007bff; }
  </style>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "TON_SUPABASE_URL";
    const supabaseKey = "TON_SUPABASE_ANON_KEY";
    window.supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    // ✅ Dictionnaire de traductions
    const translations = {
      fr: { title: "Étape 1 — Authentification", email: "Email", password: "Mot de passe", button: "Connexion / Inscription" },
      en: { title: "Step 1 — Authentication", email: "Email", password: "Password", button: "Login / Sign up" },
      es: { title: "Paso 1 — Autenticación", email: "Correo", password: "Contraseña", button: "Iniciar sesión / Registro" },
      pt: { title: "Etapa 1 — Autenticação", email: "Email", password: "Senha", button: "Entrar / Registar" },
      ar: { title: "الخطوة 1 — المصادقة", email: "البريد الإلكتروني", password: "كلمة المرور", button: "تسجيل الدخول / إنشاء حساب" },
      hi: { title: "चरण 1 — प्रमाणीकरण", email: "ईमेल", password: "पासवर्ड", button: "लॉगिन / साइन अप" }
    };
  </script>
</head>
<body>

<div id="language-screen">
  <h1>🌐 Choisissez votre langue</h1>
  <div class="lang-container">
    <button class="lang-btn" onclick="selectLanguage('fr')">🇫🇷 Français</button>
    <button class="lang-btn" onclick="selectLanguage('en')">🇬🇧 English</button>
    <button class="lang-btn" onclick="selectLanguage('hi')">🇮🇳 हिन्दी</button>
    <button class="lang-btn" onclick="selectLanguage('pt')">🇵🇹 Português</button>
    <button class="lang-btn" onclick="selectLanguage('es')">🇪🇸 Español</button>
    <button class="lang-btn" onclick="selectLanguage('ar')">🇸🇦 العربية</button>
  </div>
</div>

<div id="register-form" class="hidden">
  <h2>Étape 1 — Authentification</h2>
  <p id="confirmation" class="confirmation"></p>
  <label for="email">Email</label>
  <input type="email" id="email" placeholder="Email">
  <label for="password">Mot de passe</label>
  <input type="password" id="password" placeholder="Mot de passe">
  <button id="register-btn" onclick="handleRegister()">Connexion / Inscription</button>
  <div id="loader">⏳ Veuillez patienter...</div>
</div>

<script>
let selectedLanguage = null;

function selectLanguage(lang) {
  selectedLanguage = lang;
  document.getElementById("language-screen").classList.add("hidden");
  document.getElementById("register-form").classList.remove("hidden");

  applyLanguage(lang);

  document.getElementById("confirmation").textContent =
    "✅ Formulaire ouvert en " + getLanguageName(lang);
}

function applyLanguage(lang) {
  const t = translations[lang] || translations.fr;
  document.querySelector("#register-form h2").textContent = t.title;
  document.querySelector("label[for='email']").textContent = t.email;
  document.querySelector("label[for='password']").textContent = t.password;
  document.querySelector("#register-btn").textContent = t.button;
}

function getLanguageName(code) {
  switch(code) {
    case 'fr': return "Français";
    case 'en': return "English";
    case 'hi': return "Hindi";
    case 'pt': return "Português";
    case 'es': return "Español";
    case 'ar': return "Arabe";
    default: return code;
  }
}

async function handleRegister() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const btn = document.getElementById("register-btn");
  const loader = document.getElementById("loader");

  if (!email || !password) {
    alert("Veuillez remplir tous les champs");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Chargement...";
  loader.style.display = "block";

  try {
    const { error } = await supabaseClient.auth.signUp({
      email,
      password,
      options: { data: { language: selectedLanguage } }
    });

    if (error) {
      alert("Erreur: " + error.message);
      return;
    }

    alert("Compte créé. Vérifiez votre email.");
  } finally {
    btn.disabled = false;
    btn.textContent = translations[selectedLanguage]?.button || translations.fr.button;
    loader.style.display = "none";
  }
}
</script>

</body>
</html>
