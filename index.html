<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINK FLOW</title>
  <style>
    /* ... Vos styles existants ... */
    #video-container { margin: 20px auto; max-width: 560px; }
    .timer-display { font-weight: bold; color: #e74c3c; margin: 10px; }
    .hidden { display: none !important; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="overlay">
  <img id="logo" src="VOTRE_LOGO.png" alt="LINK FLOW Logo">
  <h1>🌐 Choisissez votre langue</h1>
  <div class="lang-container">
    <button class="lang-btn" onclick="selectLang('fr')"><span class="lang-flag">🇫🇷</span><span class="lang-name">Français</span></button>
    <button class="lang-btn" onclick="selectLang('en')"><span class="lang-flag">🇬🇧</span><span class="lang-name">English</span></button>
    </div>
</div>

<div id="app" class="hidden">
  <div class="step-indicator">
    <div id="circle1" class="circle active"></div>
    <div id="circle2" class="circle"></div>
    <div id="circle3" class="circle"></div>
    <div id="circle4" class="circle"></div>
  </div>

  <section id="auth-section">
    <h2>Étape 1 — Authentification</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Mot de passe">
    <button id="authBtn" onclick="handleAuth()">Connexion / Inscription</button>
  </section>

  <section id="video-section" class="hidden">
    <h2>Étape 2 — Vidéo obligatoire</h2>
    <p>Regardez la vidéo en entier pour débloquer la suite.</p>
    <div id="video-container">
        <div id="player"></div>
    </div>
    <div id="timer" class="timer-display"></div>
    <button id="getLinkBtn" disabled onclick="goToLinkSection()">Continuer vers l'étape 3</button>
  </section>

  <section id="link-section" class="hidden">
    <h2>Étape 3 — Parrainage</h2>
    <p id="sponsorInfo">Chargement du parrain...</p>
    <button onclick="openVictory()">S'inscrire sur Victory</button>
    <button onclick="goToValidation()">J'ai fini mon inscription</button>
  </section>

  <section id="val-section" class="hidden">
    <h2>Étape 4 — Validation</h2>
    <input type="url" id="victoryLink" placeholder="Collez votre lien de parrainage Victory">
    <button onclick="finalValidation()">Valider mon compte</button>
  </section>
</div>

<script>
// CONFIGURATION
const VIDEO_ID = '9uPybhkqYw4';
const REQUIRED_TIME = 180; // secondes
let player;
let timerInterval;

// INITIALISATION SUPABASE
const supabase = window.supabase.createClient("VOTRE_URL", "VOTRE_CLE_ANON");

function selectLang(lang) {
  document.getElementById("overlay").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
}

// GESTION AUTHENTIFICATION
async function handleAuth() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const btn = document.getElementById("authBtn");
  btn.disabled = true;

  try {
    let { data, error } = await supabase.auth.signInWithPassword({ email, password });
    
    if (error) {
      // Si erreur, on tente une inscription
      const { data: signUpData, error: signUpError } = await supabase.auth.signUp({
        email,
        password,
        options: { data: { sponsor_id: 'okoningana' } }
      });
      if (signUpError) throw signUpError;
      alert("Compte créé ! Veuillez vérifier vos emails (si configuré) ou vous connecter.");
    }
    
    showSection("video-section", 2);
    loadYouTubeAPI();
  } catch (err) {
    alert(err.message);
    btn.disabled = false;
  }
}

// CHARGEMENT API YOUTUBE
function loadYouTubeAPI() {
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  const firstScriptTag = document.getElementsByTagName('script')[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
}

function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    height: '315',
    width: '100%',
    videoId: VIDEO_ID,
    events: {
      'onStateChange': onPlayerStateChange
    }
  });
}

function onPlayerStateChange(event) {
  if (event.data == YT.PlayerState.PLAYING) {
    startTimer();
  } else {
    clearInterval(timerInterval);
  }
}

function startTimer() {
    timerInterval = setInterval(() => {
        const currentTime = Math.floor(player.getCurrentTime());
        const remaining = REQUIRED_TIME - currentTime;
        
        if (remaining > 0) {
            document.getElementById('timer').innerText = `Temps restant : ${remaining}s`;
        } else {
            document.getElementById('timer').innerText = "Vidéo validée !";
            document.getElementById('getLinkBtn').disabled = false;
            clearInterval(timerInterval);
        }
    }, 1000);
}

// NAVIGATION ENTRE SECTIONS
function showSection(id, step) {
    document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
    
    // Update circles
    for(let i=1; i<=4; i++) {
        const circle = document.getElementById(`circle${i}`);
        if(i < step) circle.className = "circle done";
        else if(i === step) circle.className = "circle active";
        else circle.className = "circle";
    }
}

function goToLinkSection() {
    showSection("link-section", 3);
    // Ici vous pourriez récupérer le vrai parrain depuis Supabase
    document.getElementById('sponsorInfo').innerText = "Votre parrain est : okoningana";
}

function openVictory() {
    window.open("https://victory-investment.com/register?ref=okoningana", "_blank");
}

function goToValidation() {
    showSection("val-section", 4);
}

async function finalValidation() {
    const link = document.getElementById("victoryLink").value;
    if(!link.includes('victory-investment.com')) {
        alert("Lien invalide");
        return;
    }
    
    const { data, error } = await supabase.from('profiles').update({ victory_link: link }).eq('id', (await supabase.auth.getUser()).data.user.id);
    
    if(error) alert(error.message);
    else alert("Félicitations ! Votre compte est en cours de validation.");
}
</script>
</body>
</html>
