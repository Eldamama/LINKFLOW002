<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINK FLOW</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; text-align: center; }
    #language-screen { padding: 20px; }
    .lang-container { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 10px; 
      max-width: 400px; 
      margin: 20px auto; 
    }
    .lang-btn { padding: 10px; cursor: pointer; border: 1px solid #ccc; border-radius: 5px; }
    .hidden { display: none !important; }
    input { display: block; margin: 10px auto; padding: 8px; width: 80%; max-width: 300px; }
    button { margin: 10px; padding: 10px 20px; cursor: pointer; }
    .confirmation { color: green; font-weight: bold; margin: 10px; }
  </style>
</head>
<body>

<!-- Écran de sélection de langue -->
<div id="language-screen">
  <img id="logo" src="VOTRE_LOGO.png" alt="LINK FLOW Logo" style="max-width:150px;">
  <h1>🌐 Choisissez votre langue</h1>
  <div class="lang-container">
    <button class="lang-btn" onclick="selectLanguage('fr')">🇫🇷 Français</button>
    <button class="lang-btn" onclick="selectLanguage('en')">🇬🇧 English</button>
    <button class="lang-btn" onclick="selectLanguage('hi')">🇮🇳 हिन्दी</button>
    <button class="lang-btn" onclick="selectLanguage('pt')">🇵🇹 Português</button>
    <button class="lang-btn" onclick="selectLanguage('es')">🇪🇸 Español</button>
    <button class="lang-btn" onclick="selectLanguage('ar')">🇸🇦 العربية</button>
  </div>
</div>

<!-- Formulaire d'inscription -->
<div id="register-form" class="hidden">
  <h2>Étape 1 — Authentification</h2>
  <p id="confirmation" class="confirmation"></p>
  <label for="email">Email</label>
  <input type="email" id="email" placeholder="Email">
  <label for="password">Mot de passe</label>
  <input type="password" id="password" placeholder="Mot de passe">
  <button onclick="handleRegister()">Connexion / Inscription</button>
</div>

<script>
let selectedLanguage = null;

function selectLanguage(lang) {
  selectedLanguage = lang;

  // Masquer l'écran de langue
  document.getElementById("language-screen").classList.add("hidden");

  // Afficher le formulaire
  document.getElementById("register-form").classList.remove("hidden");

  // Message visuel de confirmation
  document.getElementById("confirmation").textContent = 
    "✅ Formulaire ouvert en " + getLanguageName(lang);

  console.log("Langue choisie :", selectedLanguage);
}

function getLanguageName(code) {
  switch(code) {
    case 'fr': return "Français";
    case 'en': return "English";
    case 'hi': return "Hindi";
    case 'pt': return "Português";
    case 'es': return "Español";
    case 'ar': return "Arabe";
    default: return code;
  }
}

function handleRegister() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  alert("Inscription/Connexion en cours pour " + email + " avec langue " + selectedLanguage);
}
</script>

</body>
</html>
