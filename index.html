<script>
  // 1. CONFIGURATION (METS TES VRAIES INFOS ICI)
  const supabaseUrl = "https://abc123xyz.supabase.co"; 
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...";
  
  // Initialisation du client
  const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

  // 2. DICTIONNAIRE DE TRADUCTION
  const translations = {
    fr: { title: "Étape 1 — Authentification", email: "Email", password: "Mot de passe", button: "Connexion / Inscription", confirm: "Formulaire ouvert en" },
    en: { title: "Step 1 — Authentication", email: "Email", password: "Password", button: "Login / Sign up", confirm: "Form opened in" },
    es: { title: "Paso 1 — Autenticación", email: "Correo", password: "Contraseña", button: "Iniciar sesión / Registro", confirm: "Formulario abierto en" },
    pt: { title: "Etapa 1 — Autenticação", email: "Email", password: "Senha", button: "Entrar / Registar", confirm: "Formulário aberto em" },
    ar: { title: "الخطوة 1 — المصادقة", email: "البريد الإلكتروني", password: "كلمة المرور", button: "تسجيل الدخول / إنشاء حساب", confirm: "تم فتح النموذج باللغة" },
    hi: { title: "चरण 1 — प्रमाणीकरण", email: "ईमेल", password: "पासवर्ड", button: "लॉगिन / साइन अप", confirm: "फॉर्म खुला भाषा में" }
  };

  let selectedLanguage = "fr";

  // 3. FONCTIONS DE LOGIQUE
  function selectLanguage(lang) {
    if (!translations[lang]) return;
    selectedLanguage = lang;
    localStorage.setItem("language", lang);

    document.getElementById("language-screen").classList.add("hidden");
    document.getElementById("register-form").classList.remove("hidden");

    applyLanguage(lang);

    const t = translations[lang];
    document.getElementById("confirmation").textContent = "✅ " + t.confirm + " " + getLanguageName(lang);
  }

  function applyLanguage(lang) {
    const t = translations[lang] || translations.fr;
    document.querySelector("#register-form h2").textContent = t.title;
    document.querySelector("label[for='email']").textContent = t.email;
    document.querySelector("label[for='password']").textContent = t.password;
    document.querySelector("#register-btn").textContent = t.button;
    document.getElementById("email").placeholder = t.email;
    document.getElementById("password").placeholder = t.password;
  }

  function getLanguageName(code) {
    const names = { fr: "Français", en: "English", hi: "Hindi", pt: "Português", es: "Español", ar: "Arabe" };
    return names[code] || code;
  }

  async function handleRegister() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const btn = document.getElementById("register-btn");
    const loader = document.getElementById("loader");

    if (!email || !password) {
      alert("Veuillez remplir tous les champs");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Chargement...";
    loader.style.display = "block";

    try {
      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: { data: { language: selectedLanguage } }
      });

      if (error) throw error;

      alert("Compte créé. Vérifiez votre email.");
      if (data?.user) {
        await supabaseClient.from("profiles").upsert({ id: data.user.id, email, language: selectedLanguage });
      }
    } catch (err) {
      alert("Erreur: " + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = translations[selectedLanguage]?.button || translations.fr.button;
      loader.style.display = "none";
    }
  }

  // Initialisation au chargement
  window.addEventListener("DOMContentLoaded", () => {
    const localLang = localStorage.getItem("language");
    if (localLang && translations[localLang]) {
      selectLanguage(localLang);
    }
  });
</script>
