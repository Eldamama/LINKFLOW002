<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINK FLOW</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
    }

    .hidden {
      display: none;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: #000;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .lang-btn {
      margin: 10px;
      padding: 10px 20px;
      cursor: pointer;
    }

    #app {
      padding: 20px;
    }

    .step-indicator {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .circle {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: gray;
    }

    .circle.active {
      background: blue;
    }

    .circle.done {
      background: green;
    }

    #video-container {
      margin: 20px auto;
      max-width: 560px;
    }

    .timer-display {
      font-weight: bold;
      color: red;
      margin: 10px 0;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<!-- LANGUE -->
<div id="overlay">
  <h1>Choisissez votre langue</h1>

  <button class="lang-btn" onclick="selectLang('fr')">Français</button>
  <button class="lang-btn" onclick="selectLang('en')">English</button>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <div class="step-indicator">
    <div id="circle1" class="circle active"></div>
    <div id="circle2" class="circle"></div>
    <div id="circle3" class="circle"></div>
    <div id="circle4" class="circle"></div>
  </div>

  <!-- AUTH -->
  <section id="auth-section">
    <h2>Étape 1 — Authentification</h2>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Mot de passe">

    <button id="authBtn" onclick="handleAuth()">Connexion / Inscription</button>
  </section>

  <!-- VIDEO -->
  <section id="video-section" class="hidden">
    <h2>Étape 2 — Vidéo obligatoire</h2>

    <div id="video-container">
      <div id="player"></div>
    </div>

    <div id="timer" class="timer-display"></div>

    <button id="getLinkBtn" disabled onclick="goToLinkSection()">
      Continuer
    </button>
  </section>

  <!-- LINK -->
  <section id="link-section" class="hidden">
    <h2>Étape 3 — Parrainage</h2>

    <p id="sponsorInfo">Chargement...</p>

    <button onclick="openVictory()">S'inscrire sur Victory</button>
    <button onclick="goToValidation()">Continuer</button>
  </section>

  <!-- VALIDATION -->
  <section id="val-section" class="hidden">
    <h2>Étape 4 — Validation</h2>

    <input type="url" id="victoryLink" placeholder="Lien Victory">

    <button onclick="finalValidation()">Valider</button>
  </section>

</div>

<script>
let player;
let timerInterval;

const VIDEO_ID = "9uPybhkqYw4";
const REQUIRED_TIME = 180;

// SUPABASE (à remplacer)
const supabase = window.supabase.createClient("VOTRE_URL", "VOTRE_CLE_ANON");

/* =========================
   LANGUE (CORRECTION CLÉ)
========================= */
window.selectLang = function(lang) {
  document.getElementById("overlay").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
};

/* =========================
   AUTH
========================= */
window.handleAuth = async function () {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    let { error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      await supabase.auth.signUp({
        email,
        password
      });
    }

    showSection("video-section", 2);
    loadYouTube();
  } catch (e) {
    alert(e.message);
  }
};

/* =========================
   YOUTUBE
========================= */
function loadYouTube() {
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);
}

window.onYouTubeIframeAPIReady = function () {
  player = new YT.Player("player", {
    videoId: VIDEO_ID,
    events: {
      onStateChange: onPlayerStateChange
    }
  });
};

function onPlayerStateChange(event) {
  if (event.data === YT.PlayerState.PLAYING) {
    startTimer();
  }
}

/* TIMER SIMPLE (sans hack complexe ici) */
function startTimer() {
  clearInterval(timerInterval);

  timerInterval = setInterval(() => {
    const t = Math.floor(player.getCurrentTime());
    const remain = REQUIRED_TIME - t;

    if (remain > 0) {
      document.getElementById("timer").innerText =
        "Temps restant : " + remain + "s";
    } else {
      document.getElementById("timer").innerText = "Validé";
      document.getElementById("getLinkBtn").disabled = false;
      clearInterval(timerInterval);
    }
  }, 1000);
}

/* =========================
   NAVIGATION
========================= */
function showSection(id, step) {
  document.querySelectorAll("section").forEach(s => {
    s.classList.add("hidden");
  });

  document.getElementById(id).classList.remove("hidden");

  for (let i = 1; i <= 4; i++) {
    const c = document.getElementById("circle" + i);
    c.className = "circle";

    if (i < step) c.classList.add("done");
    if (i === step) c.classList.add("active");
  }
}

window.goToLinkSection = function () {
  showSection("link-section", 3);
};

window.goToValidation = function () {
  showSection("val-section", 4);
};

window.openVictory = function () {
  window.open("https://victory-investment.com/register?ref=okoningana");
};

window.finalValidation = async function () {
  const link = document.getElementById("victoryLink").value;

  if (!link.includes("victory-investment.com")) {
    alert("Lien invalide");
    return;
  }

  alert("Validation envoyée");
};
</script>

</body>
</html>
